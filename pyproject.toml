[project]
name = "radarena"
version = "0.1.0"
description = "DSPy agents for experimental image-grounded radiology report verification"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = ["dspy[litellm]==3.4.0", "python-dotenv>=1.0,<2", "pillow>=10,<13"]

[project.optional-dependencies]
radgraph = ["radgraph==0.1.18", "transformers>=4.39,<5"]

[project.scripts]
radarena = "radarena.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/radarena"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
